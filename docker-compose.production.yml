version: '3.8'

# Deep Tree Echo - Production Deployment
# Continuous autonomous operation with health monitoring

services:
  # Main Deep Tree Echo autonomous agent
  echo-autonomous:
    build:
      context: .
      dockerfile: Dockerfile.autonomous
    container_name: deep-tree-echo
    restart: always
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '0.5'
    ports:
      - "127.0.0.1:8080:8080"      # Read-only HTTP observability
      - "127.0.0.1:11434:11434"    # Ollama-compatible API
    environment:
      # LLM Provider Keys (set in .env or export)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # E1 autonomy authority and private persistence
      - ECHO_HTTP_ADDR=0.0.0.0
      - ECHO_STATE_DIRECTORY=/app/data/echo_state
      - ECHO_EVENT_STORE_PATH=/app/data/echo_state/cognitive_events.db
      - ECHO_WORKSPACE_DIRECTORY=/app/data/echo_state/workspace
      - ECHO_ENABLE_COGNITIVE_CORE=${ECHO_ENABLE_COGNITIVE_CORE:-true}
      - ECHO_COGNITIVE_CORE_INTERVAL=${ECHO_COGNITIVE_CORE_INTERVAL:-1m}
      - ECHO_ENABLE_CORE_SELF=${ECHO_ENABLE_CORE_SELF:-true}
      - ECHO_CORE_SELF_DIRECTORY=/app/data/echo_state/core-self
      - ECHO_CORE_SELF_REVIEWER_PUBLIC_KEY=${ECHO_CORE_SELF_REVIEWER_PUBLIC_KEY:-}
      - ECHO_ENABLE_ENACTION=true
      - ECHO_ENACTION_MODE=${ECHO_ENACTION_MODE:-observe}
      # Cognitive cycle configuration
      - ECHO_MAIN_LOOP_INTERVAL=${ECHO_MAIN_LOOP_INTERVAL:-5s}
      - ECHO_THOUGHT_INTERVAL=${ECHO_THOUGHT_INTERVAL:-10s}
      - ECHO_GOAL_REVIEW_INTERVAL=${ECHO_GOAL_REVIEW_INTERVAL:-1m}
      - ECHO_WISDOM_INTERVAL=${ECHO_WISDOM_INTERVAL:-10m}
      - ECHO_DREAM_LIGHT_DURATION=${ECHO_DREAM_LIGHT_DURATION:-2m}
      - ECHO_DREAM_DEEP_DURATION=${ECHO_DREAM_DEEP_DURATION:-5m}
      - ECHO_DREAM_REM_DURATION=${ECHO_DREAM_REM_DURATION:-3m}
      # Memory/persistence
      - ECHO_DATA_DIR=/app/data
      - ECHO_LOG_LEVEL=${ECHO_LOG_LEVEL:-info}
    volumes:
      - echo-data:/app/data
      - echo-logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    labels:
      - "autoheal=true"
      - "com.deep-tree-echo.version=2026-09-12-cog253-core-self"

  # Auto-restart unhealthy containers
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: echo-autoheal
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=60
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - echo-autonomous

  # Optional: Prometheus metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: echo-prometheus
    restart: unless-stopped
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'

  # Optional: Grafana dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: echo-grafana
    restart: unless-stopped
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  echo-data:
    driver: local
  echo-logs:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  default:
    name: deep-tree-echo-network
