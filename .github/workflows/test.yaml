name: test

concurrency:
  group: ${{ github.workflow }}-${{ github.pull_request.number || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/test.yaml'

env:
  GO_VERSION: '1.24'

jobs:
  # ============================================================================
  # Go Mod Tidy Check
  # ============================================================================
  go_mod_tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "Please run 'go mod tidy'" && exit 1)

  # ============================================================================
  # Unit Tests (Multi-platform)
  # ============================================================================
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests
        run: |
          go test -v -race -count=1 \
            ./core/memory/... \
            ./core/echobeats/... \
            ./core/consciousness/... \
            ./core/echodream/... \
            ./core/goals/... \
            ./core/live2d/... \
            ./core/deeptreeecho/... \
            ./core/relevance/... \
            ./core/skills/... \
            ./core/identity/...

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout 10m0s -v

  # ============================================================================
  # Build Check
  # ============================================================================
  build:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build all packages
        run: go build ./...
